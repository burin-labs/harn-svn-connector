[package]
name = "harn-svn-connector"
version = "0.2.0"
description = "Pure-Harn Subversion connector: post-commit hook normalization and polling revision scanner surface."
license = "MIT OR Apache-2.0"
repository = "https://github.com/burin-labs/harn-svn-connector"
harn = ">=0.10,<0.11"
connector_contract = "v1"

[exports]
default = "src/lib.harn"

[[providers]]
id = "svn"
connector = { harn = "src/lib.harn" }
capabilities = ["webhook", "rate_limit", "pagination"]

[providers.setup]
auth_type = "api-key"
flow = "api-key"
required_secrets = ["svn/username", "svn/password"]
setup_command = ["harn", "connect", "svn"]
validation_command = ["harn", "connect", "status", "--connector", "svn", "--json"]

[[providers.setup.health_checks]]
id = "username"
kind = "secret"
secret = "svn/username"

[[providers.setup.health_checks]]
id = "password"
kind = "secret"
secret = "svn/password"

[providers.setup.recovery]
missing_auth = "Store svn/username and svn/password before enabling Subversion bindings."
expired_credentials = "Rotate svn/password, then rerun Subversion connection validation."
revoked_credentials = "Replace svn/password with active Subversion credentials or an application password."
missing_scopes = "Grant read access to the repository and write access where outbound operations require it."
inaccessible_resource = "Confirm the credentials can access the target Subversion repository URL and paths."
transient_provider_outage = "Retry after the Subversion server is reachable."

[dependencies]

[connector_contract]
version = 1

# Security sweep 2026-05-23 (F3): with no signing secret configured for this binding the
# connector now fail-closes with 401 missing_signature instead of accepting an unsigned
# delivery. The contract harness does not seed per-binding secrets, so the unsigned-happy-path
# fixture inverts to assert the rejection envelope. A future fixture-seeding contract bump
# can restore an "event" happy-path that exercises full verification end-to-end.
[[connector_contract.fixtures]]
provider = "svn"
name = "happy path (fail-closed when no secret)"
kind = "webhook"
headers = { "x-svn-event" = "commit", "x-svn-revision" = "123" }
body_json = { event = "commit", repository = { url = "https://svn.example.com/repos/widgets" }, revision = 123, author = "ada", changed_paths = ["/trunk/README.md"] }
expect_type = "reject"
expect_response_status = 401
expect_event_count = 0

# F14 (verify before parse) means malformed JSON without a configured secret hits the F3
# fail-closed path first and returns 401 instead of 400.
[[connector_contract.fixtures]]
provider = "svn"
name = "malformed payload"
kind = "webhook"
headers = { "x-svn-event" = "commit" }
body = "{not json"
expect_type = "reject"
expect_response_status = 401
expect_event_count = 0
